# Custom Artifacts
 artifact_black_hands_dagger_name:1 "Black Hands Dagger"
 artifact_black_hands_dagger_description:0 "A Morag Tong tool of efficiency. It is enchanted with a devastating Absorb Health effect and a Blindness curse, ensuring the target never sees their end coming."

 artifact_sword_white_woe_name:1 "Sword of White Woe"
 artifact_sword_white_woe_description:0 "An Ebony broadsword. It deals massive damage and is the gold standard for any mercenary with light fingers."

 artifact_daedric_crescent_name:1 "Daedric Crescent"
 artifact_daedric_crescent_description:0 "One of the rarest blades in existence, recovered from a Dremora lord. Its jagged, dual-curved edges are designed to paralyze foes and disintegrate their armor in a single swing."

 artifact_sword_fury_name:1 "Fury"
 artifact_sword_fury_description:0 "A two-handed claymore that lives up to its name. It provides a massive offensive boost but places a drain on the wielder's own attributes."

 artifact_ice_blade_monarch_name:1 "Ice Blade of the Monarch"
 artifact_ice_blade_monarch_description:0 "A legendary claymore once belonging to the Tharn line. Its frost enchantment is so potent that it freezes blood on contact, slowing even the hardiest warriors to a crawl."

 artifact_magebane_name:1 "Magebane"
 artifact_magebane_description:0 "A Glass broadsword specifically crafted to hunt sorcerers. It reflects incoming spells and absorbs magicka, effectively turning a wizard's own power into their downfall."

 artifact_soul_drinker_name:1 "Soul Drinker"
 artifact_soul_drinker_description:0 "A Daedric longsword designed for necromancers. It simplifies the process of enchantment by trapping the soul of any victim struck down by its dark, soul-leeching edge."

 artifact_spear_bitter_mercy_name:1 "Spear of Bitter Mercy"
 artifact_spear_bitter_mercy_description:0 "A Daedric artifact associated with the God of Madness. It grants the wielder a formidable lightning shield and reflects hostile spells."

 artifact_helm_holy_fire_name:1 "Helm of Holy Fire"
 artifact_helm_holy_fire_description:0 "A unique Imperial style helm blessed for the righteous. It envelops the wearer in a protective shield of flame, punishing any enemy who dares to strike the faithful in melee."

 artifact_ring_equity_name:1 "Ring of Equity"
 artifact_ring_equity_description:0 "A Telvanni treasure used to neutralize rival mages. It grants high-level Magicka Absorption and Spell Reflection, making the wearer a literal void for any incoming sorcery."

 artifact_ring_phynaster_name:1 "Ring of Phynaster"
 artifact_ring_phynaster_description:0 "An ancient Altmeri relic designed for long-term survival. It provides significant resistances to poison, shock, and magicka, honoring the God of Adventure."

 artifact_ring_denstagmer_name:1 "Denstagmer's Ring"
 artifact_ring_denstagmer_description:0 "Perhaps the most practical ring in the East. It offers a powerful resistance to Fire, Frost, and Shock, making the elemental hazards of Vvardenfell feel like a light breeze."

 artifact_spirit_indoril_name:1 "Spirit of Indoril"
 artifact_spirit_indoril_description:0 "A shield that carries the heavy weight of Temple law. While it offers superb protection, holding it is dangerous if an Ordinator catches an "unauthorized" citizen with their sacred shield."

 artifact_succour_indoril_name:1 "Succour of Indoril"
 artifact_succour_indoril_description:0 "A sturdy shield bearing the iconography of the High House. It provides divine protection and fortifies the wielder's fatigue, allowing them to hold the line against the infidel indefinitely."

 artifact_fists_randagulf_name:1 "Fists of Randagulf"
 artifact_fists_randagulf_description:0 "These legendary gauntlets are arguably the best in Morrowind. They grant an incredible boost to both Strength and Agility."

 artifact_fork_horripilation_name:1 "Fork of Horripilation"
 artifact_fork_horripilation_description:0 "A cursed utensil forced upon by Sheogorath. It drains your magicka and does almost zero damage. It is a weapon of nonsensical madness meant only to mock the user."

 artifact_helm_oreyn_bearclaw_name:1 "Helm of Oreyn Bearclaw"
 artifact_helm_oreyn_bearclaw_description:0 "Originally worn by a legendary hunter, it significantly increases the wearer's Agility and Endurance."

 artifact_hair_shirt_saint_alanor_name:1 "Hair Shirt of Saint Alanor"
 artifact_hair_shirt_saint_alanor_description:0 "A painful vestment of the Tribunal Temple. It heals the wearer's wounds constantly but drains their energy. It serves as a reminder that true piety often requires physical sacrifice."

 artifact_spear_hunter_name:1 "Spear of the Hunter"
 artifact_spear_hunter_description:0 "The ultimate trophy of the Bloodmoon Prophecy. It is infused with the essence of Hircine, causing paralysis and lethal poison with every jagged thrust."

 artifact_mace_slurring_name:1 "Mace of Slurring"
 artifact_mace_slurring_description:0 "A weapon of social and physical destruction. On impact, it drains the victim's stamina and makes them slur, literally beating the wit and the wind out of them simultaneously."

 artifact_stendarr_hammer_name:1 "Stendarr's Hammer"
 artifact_stendarr_hammer_description:0 "A gargantuan relic. It weighs a staggering 1000 units and hits like a falling mountain, though it drains the wielder's stamina to zero with a single swing, and shatters just as easily."

 artifact_odd_dwemer_weapon_name:1 "Odd Dwemer Weapon"
 artifact_odd_dwemer_weapon_description:0 "A deadly one handed long blade, there appears to be nothing else special to this curious Dwemer weapon."

 artifact_bipolar_blade_name:1 "BiPolar Blade"
 artifact_bipolar_blade_description:0 "A unique claymore. It is enchanted with both a Frenzy spell to drive enemies mad and a Calm spell to settle them, often resulting in a confused, screaming, and then suddenly peaceful target."